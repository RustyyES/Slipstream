name: Urban Analytics CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      # Use a service container for the database
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: urban_analytics
        ports:
          - 5433:5432
        # Set health check to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn asyncpg databases psycopg2-binary
    - name: Initialize Database Schema
      run: |
        # Wait for Postgres to be ready is handled by service health check, but let's be safe
        export POSTGRES_HOST=localhost
        export POSTGRES_PORT=5433
        python3 scripts/init_db.py
    - name: Start API (Background)
      run: |
        export POSTGRES_HOST=localhost
        export POSTGRES_PORT=5433
        nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
    - name: Run Integration Tests
      run: |
        # Use our native unittest script which doesn't need pytest
        python3 tests/test_integration_native.py

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    - name: Build API Image
      run: docker build . --file Dockerfile.api --tag urban-api:latest
